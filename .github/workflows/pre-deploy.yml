name: Verify

on:
  push:
    branches:
      - main
      - rebuild
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # This job has no database. SKIP_PRERENDER is the only case where a build
      # may run without one; on Vercel an unreachable database fails the build.
      - run: bun run verify
        env:
          SKIP_PRERENDER: "1"
